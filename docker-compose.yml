version: "3"

services:
  parser:
    build:
      context: .
      dockerfile: parser.Dockerfile
    image: int_parser:latest
    container_name: int_parser
    restart: always
    ports:
      - 30087:30087
    env_file:
      - .env
    volumes:
      - /opt/parser_debug:/app/debug
    networks:
      - redis_network
networks:
  redis_network:
    external: true
